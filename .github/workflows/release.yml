name: GUI Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify signed release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/power-gui-release-signing-key.asc"
          gh api users/weby-homelab/gpg_keys \
            --jq '.[] | select(.key_id == "2D49E810C7F2527E") | .raw_key' \
            > "$key_file"
          test -s "$key_file"
          gpg --batch --with-colons --show-keys "$key_file" \
            | awk -F: '$1 == "fpr" {print $10; exit}' \
            | grep -Fxq '7AF1EDA195FE29FF093FB1CA2D49E810C7F2527E'
          gpg --batch --import "$key_file"
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git verify-tag "$GITHUB_REF_NAME"

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install build

      - name: Pin reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Build wheel and sdist
        run: |
          set -euo pipefail
          build_root="$RUNNER_TEMP/power-gui-repro-build"
          source_one="$build_root/source-one"
          source_two="$build_root/source-two"
          dist_one="$build_root/dist-one"
          dist_two="$build_root/dist-two"
          mkdir -p "$source_one" "$source_two" "$dist_one" "$dist_two"
          git archive --format=tar HEAD | tar -xf - -C "$source_one"
          git archive --format=tar HEAD | tar -xf - -C "$source_two"

          python -m build --outdir "$dist_one" "$source_one"
          python scripts/normalize_sdist.py "$dist_one"/*.tar.gz
          python -m build --outdir "$dist_two" "$source_two"
          python scripts/normalize_sdist.py "$dist_two"/*.tar.gz

          mapfile -t wheels_one < <(find "$dist_one" -maxdepth 1 -type f -name '*.whl' -print)
          mapfile -t wheels_two < <(find "$dist_two" -maxdepth 1 -type f -name '*.whl' -print)
          mapfile -t sdists_one < <(find "$dist_one" -maxdepth 1 -type f -name '*.tar.gz' -print)
          mapfile -t sdists_two < <(find "$dist_two" -maxdepth 1 -type f -name '*.tar.gz' -print)
          test "${#wheels_one[@]}" -eq 1
          test "${#wheels_two[@]}" -eq 1
          test "${#sdists_one[@]}" -eq 1
          test "${#sdists_two[@]}" -eq 1
          cmp -- "${wheels_one[0]}" "${wheels_two[0]}"
          cmp -- "${sdists_one[0]}" "${sdists_two[0]}"

          mkdir -p dist
          cp -- "${wheels_one[0]}" "${sdists_one[0]}" dist/

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/power-gui.spdx.json

      - name: Smoke-test the built wheel outside checkout
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          smoke_dir="$RUNNER_TEMP/power-gui-wheel-smoke"
          python -m pip install --no-deps --target "$smoke_dir" dist/power_gui-*.whl
          EXPECTED_VERSION="$expected" PYTHONPATH="$smoke_dir" python - <<'PY'
          import os
          import power_gui

          expected = os.environ["EXPECTED_VERSION"]
          assert power_gui.__version__ == expected, f"{power_gui.__version__} != {expected}"
          # also verify release notes version matches tag
          import pathlib

          notes_path = pathlib.Path(f"release/release-{expected}.md")
          assert notes_path.is_file(), f"release notes {notes_path} missing for tag {expected}"
          print(f"GUI wheel smoke passed: {expected}")
          PY

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"

      - name: Derive release metadata from tag
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          notes_path="release/release-${expected}.md"
          test -f "$notes_path" || { echo "release notes $notes_path missing for tag $GITHUB_REF_NAME"; exit 1; }
          # verify package version matches tag
          pkg_version=$(python -c "import pathlib, re; print(re.search(r'version = \"([^\"]+)\"', pathlib.Path('pyproject.toml').read_text()).group(1))")
          test "$pkg_version" = "$expected" || { echo "pyproject version $pkg_version != tag $expected"; exit 1; }
          echo "EXPECTED_VERSION=$expected" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_PATH=$notes_path" >> "$GITHUB_ENV"
          echo "Derived $expected -> $notes_path verified"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          generate_release_notes: false
          files: |
            dist/power_gui-*.whl
            dist/power_gui-*.tar.gz
            dist/power-gui.spdx.json

      - name: Generate release receipt
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          dist = pathlib.Path("dist")
          assets = []
          for path in sorted(dist.iterdir()):
              if path.is_file() and path.name != "power-gui.release-receipt.json":
                  if path.suffix in {".whl", ".gz", ".json"}:
                      assets.append({
                          "name": path.name,
                          "size_bytes": path.stat().st_size,
                          "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      })
          assert assets
          commit = subprocess.check_output(
              ["git", "rev-parse", "--verify", f"refs/tags/{os.environ['GITHUB_REF_NAME']}^{{commit}}"],
              text=True,
          ).strip()
          tree = subprocess.check_output(["git", "show", "-s", "--format=%T", commit], text=True).strip()
          receipt = {
              "schema": "power.gui.release-receipt.v1",
              "release": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "tag": os.environ["GITHUB_REF_NAME"],
                  "commit": commit,
                  "tree": tree,
              },
              "workflow": {
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              },
              "assets": assets,
          }
          pathlib.Path("dist/power-gui.release-receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload release receipt
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/power-gui.release-receipt.json

      - name: Read back public release and verify asset hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          readback_dir="$RUNNER_TEMP/power-gui-release-readback"
          mkdir -p "$readback_dir"
          gh release view "$GITHUB_REF_NAME" --json tagName,body,assets \
            > "$readback_dir/release.json"
          gh release download "$GITHUB_REF_NAME" --dir "$readback_dir/assets" --clobber
          python - "$readback_dir/release.json" "$readback_dir/assets" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          release = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          assets_dir = pathlib.Path(sys.argv[2])
          receipt = json.loads((assets_dir / "power-gui.release-receipt.json").read_text(encoding="utf-8"))
          import os

          expected = os.environ.get("EXPECTED_VERSION") or os.environ["GITHUB_REF_NAME"].lstrip("v")
          notes = pathlib.Path(f"release/release-{expected}.md").read_text(encoding="utf-8")
          assert release["tagName"] == receipt["release"]["tag"]
          assert release["body"] == notes
          public_names = {asset["name"] for asset in release["assets"]}
          expected_names = {item["name"] for item in receipt["assets"]}
          expected_names.add("power-gui.release-receipt.json")
          assert expected_names <= public_names
          for item in receipt["assets"]:
              path = assets_dir / item["name"]
              assert path.is_file()
              assert path.stat().st_size == item["size_bytes"]
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item["sha256"]
          print("GUI public release readback verified")
          PY
