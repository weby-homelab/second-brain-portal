name: Build, Test and Publish Docker Image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_version:
        description: "Optional image tag to publish (for example, 0.7.10)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify signed release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/power-gui-release-signing-key.asc"
          gh api users/weby-homelab/gpg_keys \
            --jq '.[] | select(.key_id == "2D49E810C7F2527E") | .raw_key' \
            > "$key_file"
          test -s "$key_file"
          gpg --batch --with-colons --show-keys "$key_file" \
            | awk -F: '$1 == "fpr" {print $10; exit}' \
            | grep -Fxq '7AF1EDA195FE29FF093FB1CA2D49E810C7F2527E'
          gpg --batch --import "$key_file"
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git verify-tag "$GITHUB_REF_NAME"

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2"
          pip download --no-deps --dest /tmp/wheels "power-framework @ https://github.com/weby-homelab/power-framework/releases/download/v3.7.4/power_framework-3.7.4-py3-none-any.whl"
          echo "f12ad02097448cd1b7663fc79681481013637d011ecde25a9085a899beb547e2  /tmp/wheels/power_framework-3.7.4-py3-none-any.whl" | sha256sum -c -
          pip install --no-cache-dir "/tmp/wheels/power_framework-3.7.4-py3-none-any.whl"
          python -c "import importlib.metadata; assert importlib.metadata.version('power-framework') == '3.7.4'"
          pip install -e ".[dev]"

      - name: Validate suite-input drift (mandatory)
        run: |
          python scripts/validate_suite_input.py

      - name: Run Ruff Lint
        run: ruff check src tests

      - name: Run Pytest Suite
        run: pytest

  pr-docker-build:
    name: PR Docker Build (no push)
    needs: validate-and-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3.0.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0
      - name: Build image (load, no push)
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          platforms: linux/amd64
          tags: power-gui:pr-${{ github.event.number }}
          build-args: |
            POWER_FRAMEWORK_COMMIT=13dd835be5f5a03b13cad4a627b0445b2451acf0
            POWER_FRAMEWORK_WHEEL_SHA256=f12ad02097448cd1b7663fc79681481013637d011ecde25a9085a899beb547e2
            SUITE_CONSTRAINTS_SHA256=33977cd71397cf4f52399d4923c067bd7f0f9199eebbf7351adeb095a1f30456
      - name: Verify image identity and SR profile
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python power-gui:pr-${{ github.event.number }} -c "import importlib.metadata, importlib.util, sys; assert importlib.metadata.version('power-framework') == '3.7.4', 'power-framework version mismatch'; assert importlib.metadata.version('power-gui') == '0.7.12', 'power-gui version mismatch'; assert importlib.util.find_spec('onnxruntime') is not None, 'onnxruntime missing'; assert importlib.util.find_spec('tokenizers') is not None, 'tokenizers missing'; assert importlib.util.find_spec('huggingface_hub') is not None, 'huggingface_hub missing'; assert importlib.util.find_spec('numpy') is not None, 'numpy missing'; assert importlib.util.find_spec('fastembed') is not None, 'fastembed missing'; print('SR profile imports PASS')"
          docker run --rm --entrypoint python power-gui:pr-${{ github.event.number }} -c "import importlib.metadata; print(importlib.metadata.version('power-framework')); print(importlib.metadata.version('power-gui'))"
          docker run --rm --entrypoint python power-gui:pr-${{ github.event.number }} -c "import power_framework; assert power_framework.__version__ == '3.7.4'; print('application schema power.application.v2 via power-framework 3.7.4 OK')"
          id_out=$(docker run --rm --entrypoint id power-gui:pr-${{ github.event.number }})
          echo "$id_out"
          echo "$id_out" | grep -q "10001" || (echo "non-root check failed"; exit 1)
          echo "non-root PASS"
      - name: Functional SR smoke (disposable vault)
        run: |
          set -euo pipefail
          vault=$(mktemp -d /tmp/pr-semantic-vault-XXXX)
          mkdir -p "$vault/01_Projects"
          mkdir -p /tmp/pr-cache
          cat > "$vault/01_Projects/SR_Test.md" <<'EOF'
          ---
          type: Project
          title: "SR Test"
          description: "Semantic rerank test"
          timestamp: 2026-08-23T00:00:00+00:00
          ---
          # SR Test

          This is a test note for semantic and rerank search. P.O.W.E.R framework provides hybrid search.
          EOF
          cat > "$vault/index.md" <<'EOF'
          ---
          type: System Guide
          title: "Test Index"
          ---
          # Test
          EOF
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m --tmpfs /home/appuser:rw,noexec,nosuid,size=64m -v "$vault:/brain:rw" -v /tmp/pr-cache:/data --entrypoint python power-gui:pr-${{ github.event.number }} -c "
          import pathlib, sys
          vault_path = pathlib.Path('/brain')
          print(f'Vault exists: {vault_path.exists()}')
          import onnxruntime, tokenizers, huggingface_hub, numpy, fastembed
          print('All SR imports present')
          try:
              from power_framework.core.embedding import get_embedding_model
              print('Embedding model import OK')
          except Exception as e:
              print(f'Embedding import: {e}')
          print('SR functional smoke PASS')
          "
          echo "SR functional smoke completed"
          rm -rf "$vault"
      - name: Security runtime smoke
        run: |
          set -euo pipefail
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m --tmpfs /home/appuser:rw,noexec,nosuid,size=64m --entrypoint python power-gui:pr-${{ github.event.number }} -c "import pathlib; p=pathlib.Path('/tmp/test'); p.write_text('ok'); assert p.read_text()=='ok'; print('read-only + tmpfs PASS')"
          echo "Security runtime smoke PASS"

  build-and-push:
    name: Build & Publish Image
    needs: validate-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226 # v3.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934 # v5.0.0
        with:
          images: |
            webyhomelab/power-gui
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.image_version }},enable=${{ inputs.image_version != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09 # v5.0.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          provenance: true
          sbom: true
          build-args: |
            POWER_FRAMEWORK_COMMIT=13dd835be5f5a03b13cad4a627b0445b2451acf0
            POWER_FRAMEWORK_WHEEL_SHA256=f12ad02097448cd1b7663fc79681481013637d011ecde25a9085a899beb547e2
            SUITE_CONSTRAINTS_SHA256=33977cd71397cf4f52399d4923c067bd7f0f9199eebbf7351adeb095a1f30456
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Read back immutable image digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.image_version || github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$BUILD_DIGEST"
          image_tag="${IMAGE_VERSION#v}"
          if [ "$IMAGE_VERSION" = "main" ]; then
            image_tag="latest"
          fi
          image="webyhomelab/power-gui:${image_tag}"
          readback="$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')"
          test "$readback" = "$BUILD_DIGEST"
          printf 'image=%s\ndigest=%s\n' "$image" "$readback" > "$RUNNER_TEMP/power-gui-image-readback.txt"

      - name: Upload immutable image readback
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: power-gui-image-readback
          path: ${{ runner.temp }}/power-gui-image-readback.txt
          if-no-files-found: error
          retention-days: 7

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: webyhomelab/power-gui
          readme-filepath: ./README.md
          short-description: "AI-native web cockpit & decision center for Obsidian Second Brain (P.O.W.E.R)"

  live-e2e:
    name: Live Docker E2E
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.image_version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.13"

      - name: Install E2E harness dependencies
        run: python -m pip install --upgrade "pip>=26.2" pytest requests

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run mandatory live two-browser E2E
        env:
          IMAGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.image_version }}
        run: |
          set -euo pipefail
          image_tag="${IMAGE_VERSION#v}"
          if [ "$IMAGE_VERSION" = "main" ]; then
            image_tag="latest"
          fi
          image="webyhomelab/power-gui:${image_tag}"
          vault="$RUNNER_TEMP/power-gui-e2e-vault"
          mkdir -p "$vault/01_Projects"
          cat > "$vault/01_Projects/E2E.md" <<'EOF'
          ---
          type: Project
          title: "Live E2E fixture"
          description: "Ephemeral release verification fixture"
          timestamp: 2026-08-20T00:00:00+00:00
          ---

          # Live E2E fixture
          EOF
          chmod -R a+rwX "$vault"
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(24))')"
          secret_key="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          docker volume create power-gui-live-e2e-cache >/dev/null
          docker volume create power-gui-live-e2e-readonly-cache >/dev/null
          cleanup() {
            docker rm -f power-gui-live-e2e power-gui-live-e2e-readonly >/dev/null 2>&1 || true
            docker volume rm power-gui-live-e2e-cache power-gui-live-e2e-readonly-cache >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d --name power-gui-live-e2e \
            --user 10001:10001 --cap-drop ALL \
            --security-opt no-new-privileges:true --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            --tmpfs /home/appuser:rw,noexec,nosuid,size=128m \
            -p 127.0.0.1:18008:8080 \
            -e POWER_GUI_AUTH_ENABLED=true \
            -e POWER_GUI_ADMIN_PASSWORD="$password" \
            -e POWER_GUI_SECRET_KEY="$secret_key" \
            -e POWER_GUI_COOKIE_SECURE=false \
            -v "$vault:/brain:rw" \
            -v power-gui-live-e2e-cache:/data \
            "$image"
          docker run -d --name power-gui-live-e2e-readonly \
            --user 10001:10001 --cap-drop ALL \
            --security-opt no-new-privileges:true --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            --tmpfs /home/appuser:rw,noexec,nosuid,size=128m \
            -p 127.0.0.1:18009:8080 \
            -e POWER_GUI_AUTH_ENABLED=true \
            -e POWER_GUI_ADMIN_PASSWORD="$password" \
            -e POWER_GUI_SECRET_KEY="$secret_key" \
            -e POWER_GUI_COOKIE_SECURE=false \
            -e POWER_GUI_READ_ONLY_MODE=true \
            -v "$vault:/brain:rw" \
            -v power-gui-live-e2e-readonly-cache:/data \
            "$image"
          for attempt in $(seq 1 60); do
            if python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:18008/healthz", timeout=2); urllib.request.urlopen("http://127.0.0.1:18009/healthz", timeout=2)' 2>/dev/null; then
              break
            fi
            if [ "$attempt" = 60 ]; then
              docker logs power-gui-live-e2e
              docker logs power-gui-live-e2e-readonly
              exit 1
            fi
            sleep 2
          done
          POWER_GUI_E2E_URL=http://127.0.0.1:18008 \
          POWER_GUI_E2E_PASSWORD="$password" \
          POWER_GUI_E2E_READONLY_URL=http://127.0.0.1:18009 \
            pytest -q tests/e2e/test_two_browser_idempotency.py -rs
