[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "power-gui"
version = "0.7.12"
description = "Secure, accessible, local-first web cockpit and decision center for P.O.W.E.R."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { text = "MIT" }
authors = [{ name = "Weby Homelab", email = "rekvizitor.ua@gmail.com" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "bleach>=6.1.0",
    "markdown>=3.6.0",
    "pygments>=2.18.0",
    "itsdangerous>=2.2.0",
    "anyio>=4.4.0",
    "power-framework==3.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "ruff>=0.5.0",
]

[project.scripts]
power-gui = "power_gui.app:main"

[tool.uv.sources]
power-framework = { git = "https://github.com/weby-homelab/power-framework.git", rev = "13dd835be5f5a03b13cad4a627b0445b2451acf0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
power_gui = [
    "templates/*.html",
    "templates/**/*.html",
    "static/**/*",
    "static/*",
    "static/js/*",
    "static/css/*",
]

[tool.ruff]

line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
